<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>옵시디언으로</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#ece6ff;color:#23344a;font:16px/1.5 -apple-system,"Apple SD Gothic Neo",sans-serif}
.c{background:#fffaf0;border:2px solid #23344a;border-radius:22px;box-shadow:0 3px 0 #23344a;padding:22px;text-align:center;max-width:320px;margin:16px}
a{display:inline-block;margin-top:12px;background:#ffd24d;color:#23344a;border:2px solid #23344a;border-radius:999px;padding:10px 20px;text-decoration:none;font-weight:700;box-shadow:0 2px 0 #23344a}
p{margin:0}small{display:block;margin-top:10px;color:#61758b}
</style>
</head>
<body>
<div class="c">
 <p id="msg">옵시디언을 여는 중이에요</p>
 <a id="go" href="#" hidden>이 노트 열기</a><br>
 <a id="find" href="#" hidden style="background:#fff">검색으로 찾기</a>
 <small>옵시디언이 꺼져 있었으면 첫 번째엔 마지막 노트가 열릴 수 있어요. 돌아와서 한 번 더 누르면 돼요.</small>
</div>
<script>
{
 // 송송지식 볼트(아이폰 이름: 송송지식함)만 연다. 다른 앱·사이트로는 넘기지 않는다.
 let path="";
 try{path=decodeURIComponent(location.hash.slice(1))}catch(e){path=""}
 const ok=path&&path.length<300&&!/[:\\]|\.\.|^\//.test(path);
 if(!ok){document.getElementById("msg").textContent="열 노트가 없어요";}
 else{
  path=path.normalize("NFC");
  const V=encodeURIComponent("송송지식함");
  const url="obsidian://open?vault="+V+"&file="+encodeURIComponent(path+".md");
  const a=document.getElementById("go");a.href=url;a.hidden=false;
  const name=path.split("/").pop();
  const f=document.getElementById("find");f.href="obsidian://search?vault="+V+"&query="+encodeURIComponent('"'+name+'"');f.hidden=false;
  document.getElementById("msg").textContent=name;
  location.href=url;
 }
}
</script>
</body>
</html>
