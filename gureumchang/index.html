<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>구름창</title>
<meta name="theme-color" content="#dff0ff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="구름창">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
/* 컨셉: 햄스터 기상캐스터 — 하늘색 바탕에 크림색 스티커 카드, 굵은 남색 테두리.
   위에서 아래로: 햄스터+오늘 한 줄 → 6시간 예보 → 영상(레이더/위성/예측) → 시간축 */
:root {
  --sky: #dff0ff;      /* 배경 하늘 */
  --cream: #fffaf0;    /* 카드 */
  --ink: #23344a;      /* 글자·테두리 (검정 대신 남색) */
  --muted: #61758b;    /* 보조 글자 */
  --butter: #ffd24d;   /* 선택·강조 (버터 노랑) */
  --rain: #3d8bef;     /* 비 (의미색) */
  --cheek: #ff9fa8;    /* 볼터치 */
  --f-display: "Jua", "Apple SD Gothic Neo", sans-serif;
  --f-body: "Gowun Dodum", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
  --radius: 22px;
  --pop: 0 3px 0 var(--ink);
  color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { background: var(--sky); }
body {
  margin: 0; min-height: 100%; background: var(--sky); color: var(--ink);
  font-family: var(--f-body); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased;
  padding: calc(env(safe-area-inset-top) + 12px) calc(env(safe-area-inset-right) + 16px) calc(env(safe-area-inset-bottom) + 20px) calc(env(safe-area-inset-left) + 16px);
  display: grid; gap: 14px; max-width: 560px; margin-inline: auto;
}
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--rain); outline-offset: 2px; }

.card { background: var(--cream); border: 2px solid var(--ink); border-radius: var(--radius); box-shadow: var(--pop); }

/* 1. 오늘 한 줄 */
.hello { display: grid; grid-template-columns: 92px 1fr; gap: 10px; align-items: center; padding: 14px 16px 14px 10px; }
.hello svg { width: 92px; height: 92px; display: block; }
.brand { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.brand h1 { margin: 0; font-family: var(--f-display); font-size: 17px; font-weight: 400; color: var(--muted); }
.brand .when { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.headline { margin: 2px 0 0; font-family: var(--f-display); font-weight: 400; font-size: 25px; line-height: 1.2; text-wrap: balance; }
.sub { margin: 4px 0 0; color: var(--muted); font-size: 14px; }
.nowline { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.pill { display: inline-flex; align-items: center; gap: 4px; border: 1.5px solid var(--ink); border-radius: 999px; padding: 1px 9px; font-size: 13px; background: #fff; font-variant-numeric: tabular-nums; }
.pill.rain { background: var(--rain); color: #fff; border-color: var(--rain); }

/* 2. 6시간 예보 */
.hours { padding: 12px 10px 10px; }
.hours h2, .viewer h2 { margin: 0 6px 8px; font-family: var(--f-display); font-weight: 400; font-size: 16px; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.hours h2 small, .viewer h2 small { font-family: var(--f-body); font-size: 12px; color: var(--muted); }
.strip { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
.slot { border-radius: 14px; padding: 8px 2px 7px; text-align: center; background: #fff; border: 1.5px solid #d7e3ef; display: grid; gap: 2px; justify-items: center; }
.slot.wet { background: #e6f1ff; border-color: var(--rain); }
.slot .hh { font-family: var(--f-display); font-size: 14px; }
.slot svg { width: 30px; height: 30px; }
.slot .t { font-size: 14px; font-variant-numeric: tabular-nums; }
.slot .r { font-size: 11px; color: var(--rain); min-height: 1.3em; line-height: 1.2; }
.cellnote { margin: 8px 6px 0; font-size: 12px; color: var(--muted); }

/* 3. 영상 */
.viewer { padding: 12px 10px 12px; }
.tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 8px; }
.tabs button { border: 2px solid var(--ink); background: #fff; border-radius: 14px; padding: 8px 2px; font-family: var(--f-display); font-size: 15px; cursor: pointer; box-shadow: 0 2px 0 var(--ink); }
.tabs button[aria-pressed="true"] { background: var(--butter); }
.tabs button:active { transform: translateY(2px); box-shadow: none; }
.chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; margin: 0 0 8px; padding: 2px; }
.chips::-webkit-scrollbar { display: none; }
.chips button { flex: none; border: 1.5px solid var(--ink); background: #fff; border-radius: 999px; padding: 3px 11px; font-size: 13px; cursor: pointer; }
.chips button[aria-pressed="true"] { background: var(--ink); color: var(--cream); }
.note { margin: 0 4px 8px; font-size: 13px; color: var(--muted); }
.stage { position: relative; aspect-ratio: 1 / 1; border-radius: 16px; overflow: hidden; background: #fff; border: 2px solid var(--ink); touch-action: none; user-select: none; -webkit-user-select: none; cursor: grab; }
.pan { position: absolute; inset: 0; transform-origin: 0 0; will-change: transform; }
.pan img { display: block; width: 100%; height: 100%; object-fit: contain; -webkit-user-drag: none; pointer-events: none; }
.pin { position: absolute; transform: translate(0, -100%); pointer-events: none; font-size: 11px; background: var(--butter); border: 1.5px solid var(--ink); border-radius: 999px 999px 999px 0; padding: 1px 7px; white-space: nowrap; }
.tools { position: absolute; right: 8px; top: 8px; display: grid; gap: 6px; justify-items: end; }
.tools button { border: 1.5px solid var(--ink); background: var(--cream); border-radius: 999px; padding: 3px 11px; font-size: 12px; cursor: pointer; }
.tools button.save { background: var(--butter); }
.hint { position: absolute; left: 50%; bottom: 8px; transform: translateX(-50%); font-size: 11px; background: rgba(255,250,240,.92); border: 1.5px solid var(--ink); border-radius: 999px; padding: 1px 9px; white-space: nowrap; pointer-events: none; }
.stage .msg { position: absolute; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; color: var(--muted); font-size: 14px; background: var(--cream); }
.stage .msg strong { display: block; color: var(--ink); font-family: var(--f-display); font-weight: 400; font-size: 17px; margin-bottom: 4px; }
.stamp { position: absolute; left: 8px; top: 8px; font-size: 12px; padding: 2px 9px; border-radius: 999px; background: var(--cream); border: 1.5px solid var(--ink); font-variant-numeric: tabular-nums; pointer-events: none; }
.timeline { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; margin-top: 10px; }
.play { width: 44px; height: 44px; border-radius: 50%; border: 2px solid var(--ink); background: var(--butter); cursor: pointer; display: grid; place-items: center; box-shadow: 0 2px 0 var(--ink); }
.play svg { width: 16px; height: 16px; fill: var(--ink); }
.play:active { transform: translateY(2px); box-shadow: none; }
input[type="range"] { width: 100%; accent-color: var(--rain); }
.ticks { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
.side { display: grid; justify-items: end; gap: 3px; }
.refresh { border: 1.5px solid var(--ink); background: #fff; border-radius: 999px; padding: 4px 11px; font-size: 13px; cursor: pointer; }
.load { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; min-height: 1.2em; }

footer { display: flex; justify-content: space-between; gap: 10px; font-size: 12px; color: var(--muted); padding: 0 4px; }
footer a { color: var(--muted); }

.err { color: #c2412d; }
@media (prefers-reduced-motion: no-preference) {
  .bob { animation: bob 3.2s ease-in-out infinite; transform-origin: 50% 100%; }
  @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-2px); } }
}
</style>
</head>
<body>

<section class="card hello" aria-live="polite">
  <svg id="ham" viewBox="0 0 100 100" role="img" aria-label="햄스터 기상캐스터"></svg>
  <div>
    <div class="brand"><h1 id="brandName">구름창</h1><span class="when" id="when"></span></div>
    <p class="headline" id="headline">하늘을 살펴보는 중이에요</p>
    <p class="sub" id="sub">기상청 예보를 받아오고 있어요.</p>
    <div class="nowline" id="nowline"></div>
  </div>
</section>

<section class="card hours">
  <h2>앞으로 6시간 <small id="fcstBase"></small></h2>
  <div class="strip" id="strip"></div>
  <p class="cellnote" id="cellnote"></p>
</section>

<section class="card viewer">
  <div class="tabs" role="group" aria-label="영상 종류">
    <button id="m-radar" data-mode="radar" aria-pressed="true">레이더 강수</button>
    <button id="m-qpf" data-mode="qpf" aria-pressed="false">앞으로 2시간</button>
    <button id="m-sat" data-mode="sat" aria-pressed="false">위성 구름</button>
  </div>
  <div class="chips" id="chips" role="group" aria-label="위성 채널"></div>
  <p class="note" id="note"></p>
  <div class="stage" id="stage">
    <div class="pan" id="pan"><img id="img" alt=""></div>
    <span class="pin" id="pin" hidden>나</span>
    <div class="stamp" id="stamp" hidden></div>
    <div class="tools">
      <button id="viewBtn">전체 보기</button>
      <button class="save" id="locBtn">내 위치</button>
    </div>
    <span class="hint" id="hint">두 손가락으로 확대 · 두 번 탭하면 전체/내 위치</span>
    <div class="msg" id="msg"><div><strong>영상 불러오는 중</strong>몇 초 걸릴 수 있어요.</div></div>
  </div>
  <div class="timeline">
    <button class="play" id="play" aria-pressed="false" aria-label="재생">
      <svg viewBox="0 0 16 16" id="playIcon"><path d="M4 2.5v11l9-5.5z"/></svg>
    </button>
    <div>
      <input type="range" id="range" min="0" max="0" value="0" aria-label="시각 선택">
      <div class="ticks"><span id="tickL">-</span><span id="tickR">-</span></div>
    </div>
    <div class="side">
      <button class="refresh" id="refresh">새로고침</button>
      <span class="load" id="load"></span>
    </div>
  </div>
</section>

<footer>
  <span>자료: 기상청 API허브 · 공공누리 제1유형</span>
  <a href="https://www.weather.go.kr/w/weather/radar/rain.do">날씨누리에서 보기</a>
</footer>

<script>
const PROXY = "https://vtxdqesewrsgyhzdvhfo.supabase.co/functions/v1/kma-proxy";
const FRAMES = 13;
const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2, "0");

/* ---------- 햄스터 (기분에 따라 소품이 바뀜) ---------- */
function hamster(mood) {
  const body = `
    <g class="bob">
      <ellipse cx="50" cy="92" rx="26" ry="4" fill="#23344a" opacity=".12"/>
      <circle cx="31" cy="40" r="9" fill="#e9a96b" stroke="#23344a" stroke-width="2.5"/>
      <circle cx="31" cy="40" r="4.5" fill="#ff9fa8"/>
      <circle cx="69" cy="40" r="9" fill="#e9a96b" stroke="#23344a" stroke-width="2.5"/>
      <circle cx="69" cy="40" r="4.5" fill="#ff9fa8"/>
      <ellipse cx="50" cy="66" rx="30" ry="26" fill="#f3c08a" stroke="#23344a" stroke-width="2.5"/>
      <ellipse cx="50" cy="74" rx="17" ry="14" fill="#fff4e3"/>
      <circle cx="40" cy="60" r="3" fill="#23344a"/>
      <circle cx="60" cy="60" r="3" fill="#23344a"/>
      <circle cx="41" cy="59" r="1" fill="#fff"/>
      <circle cx="61" cy="59" r="1" fill="#fff"/>
      <ellipse cx="33" cy="67" rx="5" ry="3.2" fill="#ff9fa8" opacity=".85"/>
      <ellipse cx="67" cy="67" rx="5" ry="3.2" fill="#ff9fa8" opacity=".85"/>
      <path d="M48 64.5 q2 2 4 0" fill="none" stroke="#23344a" stroke-width="2" stroke-linecap="round"/>
      <path d="M50 66.5 v2" stroke="#23344a" stroke-width="2" stroke-linecap="round"/>
      <ellipse cx="38" cy="86" rx="6" ry="3.5" fill="#f3c08a" stroke="#23344a" stroke-width="2"/>
      <ellipse cx="62" cy="86" rx="6" ry="3.5" fill="#f3c08a" stroke="#23344a" stroke-width="2"/>
    </g>`;
  const umbrella = `
    <g class="bob">
      <path d="M74 50 V82 q0 5 -5 5" fill="none" stroke="#23344a" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M50 50 Q74 14 98 50 Q92 45 86 50 Q80 45 74 50 Q68 45 62 50 Q56 45 50 50Z" fill="#3d8bef" stroke="#23344a" stroke-width="2.5" stroke-linejoin="round"/>
      <circle cx="72" cy="78" r="5" fill="#f3c08a" stroke="#23344a" stroke-width="2"/>
    </g>`;
  const drops = `
    <g fill="#3d8bef"><path d="M14 18 q3 5 0 7 q-3 -2 0 -7z"/><path d="M24 6 q3 5 0 7 q-3 -2 0 -7z"/><path d="M8 34 q3 5 0 7 q-3 -2 0 -7z"/></g>`;
  const sun = `
    <g><circle cx="84" cy="16" r="9" fill="#ffd24d" stroke="#23344a" stroke-width="2.5"/>
    <g stroke="#23344a" stroke-width="2.5" stroke-linecap="round"><path d="M84 1v3"/><path d="M99 16h-3"/><path d="M94.6 5.4l-2 2"/><path d="M94.6 26.6l-2 -2"/></g></g>
    <path d="M37 59 h6 M57 59 h6" stroke="#23344a" stroke-width="0"/>`;
  const cloud = `
    <g><path d="M70 26 a8 8 0 0 1 8 -9 a10 10 0 0 1 19 3 a7 7 0 0 1 -1 14 h-21 a7 7 0 0 1 -5 -8z" fill="#fff" stroke="#23344a" stroke-width="2.5" stroke-linejoin="round"/></g>`;
  const snow = `
    <g><path d="M30 44 Q50 26 70 44 Z" fill="#ff7d8b" stroke="#23344a" stroke-width="2.5" stroke-linejoin="round"/>
    <circle cx="50" cy="28" r="5" fill="#fff" stroke="#23344a" stroke-width="2"/></g>
    <g fill="#fff" stroke="#23344a" stroke-width="1.2"><circle cx="12" cy="18" r="3"/><circle cx="88" cy="12" r="3"/><circle cx="20" cy="40" r="2.5"/></g>`;
  const extra = { rain: drops + umbrella, umbrella: umbrella, sunny: sun, cloudy: cloud, snow: snow, wait: "" }[mood] ?? "";
  // 우산 소품은 몸 뒤가 아니라 앞에 오도록 몸을 먼저 그림
  return body + extra;
}
function setHamster(mood) { $("ham").innerHTML = hamster(mood); }

/* ---------- 날씨 아이콘 (예보 줄) ---------- */
function wxIcon(h) {
  const night = +h.hh < 6 || +h.hh >= 19;
  if (h.pty === "3" || h.pty === "7") return `<svg viewBox="0 0 32 32"><path d="M8 18a6 6 0 0 1 6-7 7 7 0 0 1 13 2 5 5 0 0 1-1 10H9a5 5 0 0 1-1-5z" fill="#fff" stroke="#23344a" stroke-width="2"/><g fill="#fff" stroke="#23344a" stroke-width="1.2"><circle cx="12" cy="28" r="2"/><circle cx="20" cy="29" r="2"/></g></svg>`;
  if (h.pty !== "0") return `<svg viewBox="0 0 32 32"><path d="M6 16a6 6 0 0 1 6-7 7 7 0 0 1 13 2 5 5 0 0 1-1 10H7a5 5 0 0 1-1-5z" fill="#cfe3fb" stroke="#23344a" stroke-width="2"/><g fill="#3d8bef"><path d="M11 24q2 3 0 5q-2-2 0-5z"/><path d="M19 24q2 3 0 5q-2-2 0-5z"/></g></svg>`;
  if (h.sky === "1") return night
    ? `<svg viewBox="0 0 32 32"><path d="M20 5a11 11 0 1 0 8 17A9 9 0 0 1 20 5z" fill="#ffe7a0" stroke="#23344a" stroke-width="2"/></svg>`
    : `<svg viewBox="0 0 32 32"><circle cx="16" cy="16" r="7" fill="#ffd24d" stroke="#23344a" stroke-width="2"/><g stroke="#23344a" stroke-width="2" stroke-linecap="round"><path d="M16 3v3M16 26v3M3 16h3M26 16h3M7 7l2 2M23 23l2 2M25 7l-2 2M9 23l-2 2"/></g></svg>`;
  const shade = h.sky === "4" ? "#dde5ee" : "#fff";
  const peek = h.sky === "3" ? (night ? `<path d="M22 4a7 7 0 1 0 6 11 6 6 0 0 1-6-11z" fill="#ffe7a0" stroke="#23344a" stroke-width="1.6"/>` : `<circle cx="22" cy="10" r="6" fill="#ffd24d" stroke="#23344a" stroke-width="1.6"/>`) : "";
  return `<svg viewBox="0 0 32 32">${peek}<path d="M5 21a6 6 0 0 1 6-7 7 7 0 0 1 13 2 5 5 0 0 1-1 10H6a5 5 0 0 1-1-5z" fill="${shade}" stroke="#23344a" stroke-width="2"/></svg>`;
}

/* ---------- 동네 브리핑 ---------- */
// "02시" → "새벽 2시", "17시" → "오후 5시"
function speakHours(t) {
  return t.replace(/(\d{2})시/g, (_, hh) => {
    const h = +hh;
    const part = h < 6 ? "새벽" : h < 12 ? "오전" : h < 18 ? "오후" : "밤";
    const h12 = h === 0 ? 12 : h > 12 ? h - 12 : h;
    return `${part} ${h12}시`;
  });
}
async function loadBrief() {
  setHamster("wait");
  try {
    // 위치는 약 1km 단위로만 보냄(예보칸이 5km라 충분)
    const q = me ? `&lat=${me.lat.toFixed(2)}&lon=${me.lon.toFixed(2)}` : "";
    const res = await fetch(`${PROXY}?kind=brief${q}`);
    const b = await res.json();
    if (!res.ok) throw Object.assign(new Error(b.error || "오류"), { detail: b.detail || "" });
    $("headline").textContent = speakHours(b.headline);
    $("sub").textContent = speakHours(b.sub);
    setHamster(b.mood);
    const n = b.now;
    const pills = [];
    if (n.t1h !== null) pills.push(`<span class="pill">지금 ${n.t1h}°</span>`);
    if (b.today && b.today.tmx !== null && b.today.tmn !== null) pills.push(`<span class="pill">최고 ${b.today.tmx}° · 최저 ${b.today.tmn}°</span>`);
    if (n.ptyName) pills.push(`<span class="pill rain">${n.ptyName} 오는 중</span>`);
    if (n.reh !== null) pills.push(`<span class="pill">습도 ${n.reh}%</span>`);
    if (n.wsd !== null) pills.push(`<span class="pill">바람 ${n.wsd}m/s</span>`);
    $("nowline").innerHTML = pills.join("");
    $("when").textContent = `${n.base.slice(8, 10)}시 관측`;
    $("fcstBase").textContent = `${b.fcstBase.slice(8, 10)}:${b.fcstBase.slice(10, 12)} 발표`;
    $("strip").innerHTML = b.hours.slice(0, 6).map(h => `
      <div class="slot${h.pty !== "0" ? " wet" : ""}">
        <span class="hh">${+h.hh}시</span>${wxIcon(h)}
        <span class="t">${h.t1h ?? "-"}°</span>
        <span class="r">${h.pty !== "0" ? (h.rn1 ? h.rn1.replace("1mm 미만", "1mm↓") : h.ptyName) : ""}</span>
      </div>`).join("");
    $("brandName").textContent = b.where === "here" ? "구름창 · 내 위치" : "구름창 · 우리 동네";
    $("cellnote").textContent = b.where === "here"
      ? "지금 있는 곳의 5km 예보칸 기준이에요."
      : "위치를 못 받아서 분당 기준으로 보여드려요.";
  } catch (e) {
    setHamster("cloudy");
    $("headline").textContent = "예보를 못 받았어요";
    const d = (e.detail || "").toLowerCase();
    $("sub").innerHTML = d.includes("활용") || d.includes("403")
      ? `<span class="err">기상청 API허브에서 4.1 초단기실황·4.2 초단기예보 활용신청이 필요해요.</span>`
      : `<span class="err">잠시 뒤 새로고침을 눌러주세요.</span>`;
  }
}

/* ---------- 영상 (레이더 / 예측 / 위성) ---------- */
const SAT_CH = [
  { obs: "ir105", name: "적외", note: "밤낮 상관없이 보여요. 하얄수록 높고 차가운 구름이에요." },
  { obs: "vi006", name: "가시", note: "사진처럼 보이지만 해가 있을 때만 찍혀요. 밤에는 까맣게 나와요." },
  { obs: "wv069", name: "수증기", note: "구름이 생기기 전, 습한 공기가 흐르는 길이 보여요." },
  { obs: "sw038", name: "단파적외", note: "밤에 안개와 낮은 구름을 찾을 때 좋아요." },
];
const NOTES = {
  radar: "지금 실제로 비가 오는 곳이에요. ▶를 누르면 지난 2시간 동안 비구름이 어떻게 왔는지 보여요.",
  qpf: "비구름이 앞으로 어디로 갈지 예측한 영상이에요. 10분 뒤부터 2시간 뒤까지.",
};
const S = { mode: "radar", obs: "ir105", frames: [], idx: 0, timer: null, token: 0, zoom: false };
try {
  const saved = JSON.parse(localStorage.getItem("gureumchang") || "{}");
  if (["sat", "radar", "qpf"].includes(saved.mode)) S.mode = saved.mode;
  if (SAT_CH.some(c => c.obs === saved.obs)) S.obs = saved.obs;
} catch (e) {}
const save = () => { try { localStorage.setItem("gureumchang", JSON.stringify({ mode: S.mode, obs: S.obs })); } catch (e) {} };

const parseTm = s => new Date(Date.UTC(+s.slice(0,4), +s.slice(4,6)-1, +s.slice(6,8), +s.slice(8,10), +s.slice(10,12)) - 9*3600e3);
const fmtTm = d => { const k = new Date(d.getTime() + 9*3600e3); return `${k.getUTCFullYear()}${pad(k.getUTCMonth()+1)}${pad(k.getUTCDate())}${pad(k.getUTCHours())}${pad(k.getUTCMinutes())}`; };
const hhmm = d => { const k = new Date(d.getTime() + 9*3600e3); return `${pad(k.getUTCHours())}:${pad(k.getUTCMinutes())}`; };

function showMsg(t, b) { $("msg").hidden = false; $("msg").innerHTML = `<div><strong>${t}</strong>${b || ""}</div>`; }
function hideMsg() { $("msg").hidden = true; }

async function getImage(params) {
  const res = await fetch(`${PROXY}?${new URLSearchParams(params)}`);
  const type = res.headers.get("content-type") || "";
  if (!res.ok || !type.includes("image")) {
    let info = {}; try { info = await res.json(); } catch (e) {}
    throw Object.assign(new Error(info.error || `응답 오류 ${res.status}`), { detail: info.detail || "", status: res.status });
  }
  return { url: URL.createObjectURL(await res.blob()), tm: res.headers.get("x-kma-tm") };
}
function explain(err) {
  const d = (err.detail || "").toLowerCase();
  if (err.status === 503) return ["인증키가 아직 없어요", "Supabase Secrets에 KMA_AUTH_KEY를 넣어주세요."];
  if (d.includes("403") || d.includes("활용")) return ["활용신청이 필요해요", "기상청 API허브에서 이 영상의 API를 활용신청해 주세요."];
  if (!navigator.onLine) return ["인터넷이 끊겼어요", "연결되면 새로고침을 눌러주세요."];
  return ["영상을 못 받았어요", "기상청 서버가 잠깐 느린 것 같아요. 잠시 뒤 새로고침!"];
}

function renderControls() {
  for (const b of document.querySelectorAll(".tabs button")) b.setAttribute("aria-pressed", String(b.dataset.mode === S.mode));
  if (S.mode === "sat") {
    $("chips").hidden = false;
    $("chips").innerHTML = SAT_CH.map(c => `<button id="ch-${c.obs}" data-obs="${c.obs}" aria-pressed="${c.obs === S.obs}">${c.name}</button>`).join("");
    $("note").textContent = SAT_CH.find(c => c.obs === S.obs).note;
  } else {
    $("chips").hidden = true; $("chips").innerHTML = "";
    $("note").textContent = NOTES[S.mode];
  }
}
const label = f => S.mode === "qpf" ? `+${f.ef}분 · ${hhmm(f.at)}` : `${hhmm(f.at)}`;
function show(i) {
  const f = S.frames[i]; if (!f) return;
  S.idx = i; $("range").value = String(i);
  if (f.url) {
    if (!$("img").src) $("img").onload = () => { $("img").onload = null; applyZ(false); };
    $("img").src = f.url;
    $("img").alt = `${S.mode === "radar" ? "레이더 강수" : S.mode === "qpf" ? "강수 예측" : "위성"} 영상 ${label(f)}`;
    $("stamp").hidden = false; $("stamp").textContent = label(f); hideMsg();
  }
}
function updateTicks() {
  const fs = S.frames;
  if (!fs.length) { $("tickL").textContent = "-"; $("tickR").textContent = "-"; $("load").textContent = ""; return; }
  $("tickL").textContent = S.mode === "qpf" ? `+${fs[0].ef}분` : hhmm(fs[0].at);
  $("tickR").textContent = S.mode === "qpf" ? `+${fs[fs.length-1].ef}분` : "지금";
  const ok = fs.filter(f => f.url).length;
  $("load").textContent = ok < fs.length ? `${ok}/${fs.length}장` : "";
}
function stop() { clearInterval(S.timer); S.timer = null; $("play").setAttribute("aria-pressed", "false"); $("play").setAttribute("aria-label", "재생"); $("playIcon").innerHTML = '<path d="M4 2.5v11l9-5.5z"/>'; }
function play() {
  if (S.frames.filter(f => f.url).length < 2) return;
  $("play").setAttribute("aria-pressed", "true"); $("play").setAttribute("aria-label", "정지");
  $("playIcon").innerHTML = '<path d="M3.5 2.5h3v11h-3zM9.5 2.5h3v11h-3z"/>';
  S.timer = setInterval(() => {
    let j = S.idx;
    for (let k = 0; k < S.frames.length; k++) { j = (j + 1) % S.frames.length; if (S.frames[j].url) break; }
    show(j);
  }, 450);
}

async function loadImages() {
  const token = ++S.token;
  stop();
  S.frames.forEach(f => f.url && URL.revokeObjectURL(f.url));
  S.frames = []; updateTicks();
  $("img").removeAttribute("src"); $("stamp").hidden = true;
  showMsg("영상 불러오는 중", "몇 초 걸릴 수 있어요.");
  const base = S.mode === "sat" ? { kind: "sat", obs: S.obs, size: 1440 } : S.mode === "radar" ? { kind: "radar", size: 1440 } : { kind: "qpf", ef: 60, size: 1440 };
  let latest;
  try { latest = await getImage(base); }
  catch (err) { if (token !== S.token) return; const [t, b] = explain(err); showMsg(t, b); return; }
  if (token !== S.token) { URL.revokeObjectURL(latest.url); return; }
  const at = parseTm(latest.tm);
  if (S.mode === "qpf") {
    S.frames = Array.from({ length: 12 }, (_, i) => ({ ef: (i + 1) * 10, at: new Date(at.getTime() + (i + 1) * 600e3), url: null }));
    S.frames[5].url = latest.url; $("range").max = "11"; show(5);
  } else {
    S.frames = Array.from({ length: FRAMES }, (_, i) => ({ at: new Date(at.getTime() - (FRAMES - 1 - i) * 600e3), url: null }));
    S.frames[FRAMES - 1].url = latest.url; $("range").max = String(FRAMES - 1); show(FRAMES - 1);
  }
  updateTicks();
  const todo = S.frames.map((f, i) => i).filter(i => !S.frames[i].url).reverse();
  const worker = async () => {
    while (todo.length) {
      const i = todo.shift(); const f = S.frames[i];
      const p = S.mode === "qpf" ? { kind: "qpf", ef: f.ef, tm: latest.tm, size: 1440 } : { ...base, tm: fmtTm(f.at) };
      try {
        const r = await getImage(p);
        if (token !== S.token) { URL.revokeObjectURL(r.url); return; }
        f.url = r.url; if (S.idx === i) show(i);
      } catch (e) { if (token !== S.token) return; }
      updateTicks();
    }
  };
  await Promise.all([worker(), worker()]);
  if (token !== S.token) return;
  const cur = S.frames[S.idx];
  S.frames = S.frames.filter(f => f.url);
  $("range").max = String(Math.max(0, S.frames.length - 1));
  show(Math.max(0, S.frames.indexOf(cur)));
  updateTicks();
}

document.querySelector(".tabs").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b || b.dataset.mode === S.mode) return;
  S.mode = b.dataset.mode; save(); renderControls(); loadImages();
});
$("chips").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b || b.dataset.obs === S.obs) return;
  S.obs = b.dataset.obs; save(); renderControls(); loadImages();
});
$("range").addEventListener("input", e => { stop(); show(+e.target.value); });
$("play").addEventListener("click", () => S.timer ? stop() : play());
$("refresh").addEventListener("click", () => { loadBrief(); loadImages(); });
/* ---------- 영상 확대·이동 (영상 칸 안에서만) ---------- */
// 기상청 HR 지도(레이더·위성·예측 공통)의 위경도 → 지도 위치 변환
// 기상청 표준 람베르트 도법(표준위도 30·60°, 기준 126°E 38°N). 서울·제주로 맞추고 울릉도로 검증한 값.
// 지도는 영상 왼쪽 위 (0,20)에서 시작하는 정사각형(오른쪽 35px는 범례), 720px 기준 km당 0.7016px.
const MAP = { k: 0.7016, a: 310.4, b: 185.7, S: 720, top: 20, legend: 35 };
function lcc(lat, lon) {
  const D = Math.PI / 180, re = 6371.00877, s1 = 30 * D, s2 = 60 * D, ol = 126 * D, oa = 38 * D;
  const sn = Math.log(Math.cos(s1) / Math.cos(s2)) / Math.log(Math.tan(Math.PI / 4 + s2 / 2) / Math.tan(Math.PI / 4 + s1 / 2));
  const sf = Math.pow(Math.tan(Math.PI / 4 + s1 / 2), sn) * Math.cos(s1) / sn;
  const ro = re * sf / Math.pow(Math.tan(Math.PI / 4 + oa / 2), sn);
  const ra = re * sf / Math.pow(Math.tan(Math.PI / 4 + lat * D / 2), sn);
  const th = (lon * D - ol) * sn;
  return [ra * Math.sin(th), ro - ra * Math.cos(th)];
}
// 위경도 → 영상 칸 안의 비율 위치(u, v)
function latLonToUV(lat, lon) {
  const [X, Y] = lcc(lat, lon);
  const mu = (MAP.a + MAP.k * X) / MAP.S, mv = (MAP.b - MAP.k * Y) / MAP.S;
  const img = $("img");
  const iw = img.naturalWidth || 1475, ih = img.naturalHeight || 1460;
  const S = iw - MAP.legend;
  const { W, H } = dims();
  const sc = Math.min(W / iw, H / ih);
  const ox = (W - iw * sc) / 2, oy = (H - ih * sc) / 2;
  return { u: (ox + mu * S * sc) / W, v: (oy + (MAP.top + mv * S) * sc) / H };
}
// 위치를 못 받으면 분당구 중심 근처를 기본으로
const DEFAULT_LL = { lat: 37.38, lon: 127.12 };
const HOME_ZOOM = 5;
const Z = { s: 1, x: 0, y: 0 };
let me = null; // { lat, lon }
try { const m = JSON.parse(localStorage.getItem("gc_me") || "null"); if (m && m.lat) me = m; } catch (e) {}
const here = () => latLonToUV((me || DEFAULT_LL).lat, (me || DEFAULT_LL).lon);
const stage = $("stage"), pan = $("pan");
const dims = () => ({ W: stage.clientWidth, H: stage.clientHeight });
function clampZ() {
  const { W, H } = dims();
  Z.s = Math.min(10, Math.max(1, Z.s));
  Z.x = Math.min(0, Math.max(W * (1 - Z.s), Z.x));
  Z.y = Math.min(0, Math.max(H * (1 - Z.s), Z.y));
}
function center() { const { W, H } = dims(); return { u: (W / 2 - Z.x) / (W * Z.s), v: (H / 2 - Z.y) / (H * Z.s) }; }
function applyZ(persist) {
  clampZ();
  pan.style.transform = `translate(${Z.x}px, ${Z.y}px) scale(${Z.s})`;
  const { W, H } = dims();
  const zoomed = Z.s > 1.3;
  $("viewBtn").textContent = zoomed ? "전체 보기" : "우리 동네";
  const pin = $("pin");
  pin.hidden = !me;
  if (me) { const h = here(); pin.style.left = `${Z.x + h.u * W * Z.s}px`; pin.style.top = `${Z.y + h.v * H * Z.s}px`; }
  if (persist) { const c = center(); try { localStorage.setItem("gc_view", JSON.stringify({ s: Z.s, u: c.u, v: c.v })); } catch (e) {} }
}
function focusOn(u, v, s) { const { W, H } = dims(); Z.s = s; Z.x = W / 2 - u * W * s; Z.y = H / 2 - v * H * s; applyZ(true); }
function zoomAt(px, py, ns) { const cx = (px - Z.x) / Z.s, cy = (py - Z.y) / Z.s; Z.s = Math.min(10, Math.max(1, ns)); Z.x = px - cx * Z.s; Z.y = py - cy * Z.s; applyZ(true); }
function goHere() { const h = here(); focusOn(h.u, h.v, HOME_ZOOM); }
function toggleView() { if (Z.s > 1.3) focusOn(0.5, 0.5, 1); else goHere(); }

const pts = new Map();
let g = null, lastTap = 0, lastTapXY = [0, 0], moved = false;
const local = e => { const r = stage.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
try { if (localStorage.getItem("gc_hinted")) $("hint").hidden = true; } catch (e) {}
stage.addEventListener("pointerdown", e => {
  if (e.target.closest(".tools")) return;
  if (!$("hint").hidden) { $("hint").hidden = true; try { localStorage.setItem("gc_hinted", "1"); } catch (err) {} }
  stage.setPointerCapture(e.pointerId);
  pts.set(e.pointerId, local(e)); moved = false;
  startGesture();
});
function startGesture() {
  const p = [...pts.values()];
  if (p.length === 1) g = { type: "pan", p0: p[0], x0: Z.x, y0: Z.y };
  else if (p.length >= 2) {
    const [a, b] = p; const mid = [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
    g = { type: "pinch", d0: Math.hypot(a[0] - b[0], a[1] - b[1]) || 1, s0: Z.s, cx: (mid[0] - Z.x) / Z.s, cy: (mid[1] - Z.y) / Z.s };
  }
}
stage.addEventListener("pointermove", e => {
  if (!pts.has(e.pointerId) || !g) return;
  pts.set(e.pointerId, local(e));
  const p = [...pts.values()];
  if (g.type === "pan" && p.length === 1) {
    const dx = p[0][0] - g.p0[0], dy = p[0][1] - g.p0[1];
    if (Math.hypot(dx, dy) > 6) moved = true;
    Z.x = g.x0 + dx; Z.y = g.y0 + dy; applyZ(false);
  } else if (g.type === "pinch" && p.length >= 2) {
    moved = true;
    const [a, b] = p; const mid = [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
    Z.s = Math.min(10, Math.max(1, g.s0 * Math.hypot(a[0] - b[0], a[1] - b[1]) / g.d0));
    Z.x = mid[0] - g.cx * Z.s; Z.y = mid[1] - g.cy * Z.s; applyZ(false);
  }
});
function endPointer(e) {
  if (!pts.has(e.pointerId)) return;
  const xy = pts.get(e.pointerId);
  pts.delete(e.pointerId);
  if (pts.size === 0) {
    if (!moved) {
      const now = Date.now();
      if (now - lastTap < 320 && Math.hypot(xy[0] - lastTapXY[0], xy[1] - lastTapXY[1]) < 30) {
        lastTap = 0;
        if (Z.s > 1.3) focusOn(0.5, 0.5, 1); else zoomAt(xy[0], xy[1], HOME_ZOOM);
      } else { lastTap = now; lastTapXY = xy; }
    }
    g = null; applyZ(true);
  } else startGesture();
}
stage.addEventListener("pointerup", endPointer);
stage.addEventListener("pointercancel", endPointer);
stage.addEventListener("wheel", e => { e.preventDefault(); const [px, py] = local(e); zoomAt(px, py, Z.s * Math.exp(-e.deltaY * 0.0025)); }, { passive: false });
// iOS 사파리의 페이지 확대 제스처가 영상 칸 안에서는 동작하지 않게
for (const ev of ["gesturestart", "gesturechange"]) stage.addEventListener(ev, e => e.preventDefault());
$("viewBtn").addEventListener("click", toggleView);
function locate(thenFocus) {
  if (!navigator.geolocation) { $("locBtn").textContent = "위치 사용 불가"; return; }
  $("locBtn").textContent = "찾는 중…";
  navigator.geolocation.getCurrentPosition(pos => {
    const prev = me;
    me = { lat: +pos.coords.latitude.toFixed(4), lon: +pos.coords.longitude.toFixed(4) };
    try { localStorage.setItem("gc_me", JSON.stringify(me)); } catch (e) {}
    if (!prev || Math.abs(prev.lat - me.lat) > 0.01 || Math.abs(prev.lon - me.lon) > 0.01) loadBrief();
    $("locBtn").textContent = "내 위치";
    if (thenFocus) goHere(); else applyZ(false);
  }, () => {
    $("locBtn").textContent = "위치 허용 필요";
    setTimeout(() => { $("locBtn").textContent = "내 위치"; }, 2500);
    if (thenFocus) goHere();
  }, { enableHighAccuracy: false, timeout: 10000, maximumAge: 10 * 60e3 });
}
$("locBtn").addEventListener("click", () => locate(true));
window.addEventListener("resize", () => { const c = center(); const s = Z.s; focusOn(c.u, c.v, s); });
function restoreView() {
  let v = null;
  try { v = JSON.parse(localStorage.getItem("gc_view") || "null"); } catch (e) {}
  if (v && v.s >= 1 && v.u > 0 && v.u < 1) focusOn(v.u, v.v, v.s); else goHere();
  // 위치를 조용히 갱신(이미 허용했으면 묻지 않고 받아옴). 처음 쓰는 거면 위치가 잡힐 때 그쪽으로 이동
  locate(!v);
}

let loadedAt = Date.now();
const refreshAll = () => { loadedAt = Date.now(); loadBrief(); loadImages(); };
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && Date.now() - loadedAt > 5 * 60e3) refreshAll(); });
setInterval(() => { if (document.visibilityState === "visible" && !S.timer) refreshAll(); }, 10 * 60e3);

renderControls();
restoreView();
loadBrief();
loadImages();
</script>
</body>
</html>
