<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>퇴근버스</title>
<meta name="theme-color" content="#dff0ff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="퇴근버스">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
/* 구름창과 같은 결: 하늘색 바탕, 크림 스티커 카드, 남색 굵은 테두리.
   위: 정류장 + 퇴근까지 남은 시간 → 아래: 버스별 카드(몇 분 뒤 · 도착 시각 · 몇 정거장 전) */
:root {
  --sky: #dff0ff;
  --cream: #fffaf0;
  --ink: #23344a;
  --muted: #61758b;
  --butter: #ffd24d;
  --green: #3fa34d;   /* 일반버스 */
  --village: #7cb82f; /* 마을버스 */
  --soon: #e8553f;    /* 곧 도착 */
  --f-display: "Jua", "Apple SD Gothic Neo", sans-serif;
  --f-body: "Gowun Dodum", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
  --pop: 0 3px 0 var(--ink);
  color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { background: var(--sky); }
body {
  margin: 0; background: var(--sky); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.5;
  padding: calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 20px);
  display: grid; gap: 14px; max-width: 560px; margin-inline: auto; -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid #3d8bef; outline-offset: 2px; }
.card { background: var(--cream); border: 2px solid var(--ink); border-radius: 22px; box-shadow: var(--pop); }

.top { padding: 14px 16px; display: grid; gap: 4px; }
.top .row { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.top h1 { margin: 0; font-family: var(--f-display); font-weight: 400; font-size: 17px; color: var(--muted); }
.top .updated { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.station { margin: 0; font-family: var(--f-display); font-weight: 400; font-size: 23px; line-height: 1.25; text-wrap: balance; }
.meta { font-size: 13px; color: var(--muted); }
.leave { margin-top: 6px; display: inline-flex; align-items: center; gap: 6px; width: fit-content; background: var(--butter); border: 1.5px solid var(--ink); border-radius: 999px; padding: 2px 11px; font-size: 13px; font-variant-numeric: tabular-nums; }

.bus { padding: 14px 16px; display: grid; gap: 10px; }
.bus .head { display: flex; align-items: center; gap: 10px; }
.badge { font-family: var(--f-display); font-size: 22px; color: #fff; border: 2px solid var(--ink); border-radius: 12px; padding: 0 12px; min-width: 64px; text-align: center; box-shadow: 0 2px 0 var(--ink); }
.badge.일반 { background: var(--green); }
.badge.마을 { background: var(--village); }
.dest { font-size: 13px; color: var(--muted); line-height: 1.3; }
.dest b { color: var(--ink); font-weight: 400; font-family: var(--f-display); font-size: 14px; }
.now { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.mins { font-family: var(--f-display); font-size: 44px; line-height: 1; font-variant-numeric: tabular-nums; }
.mins small { font-size: 20px; margin-left: 2px; }
.mins.soon { color: var(--soon); }
.detail { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
.detail strong { color: var(--ink); font-weight: 400; }
.tags { display: flex; gap: 6px; flex-wrap: wrap; }
.tag { font-size: 12px; border: 1.5px solid var(--ink); border-radius: 999px; padding: 0 9px; background: #fff; }
.tag.hit { background: var(--butter); }
.nextbus { border-top: 1.5px dashed #c9d6e4; padding-top: 8px; font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
.empty { font-family: var(--f-display); font-size: 20px; color: var(--muted); }

.toggle { justify-self: start; border: 1.5px solid var(--ink); background: #fff; border-radius: 999px; padding: 3px 12px; font-size: 13px; cursor: pointer; }
.toggle[aria-expanded="true"] { background: var(--ink); color: var(--cream); }
.route { list-style: none; margin: 4px 0 0; padding: 0; position: relative; }
.route li { position: relative; padding: 7px 0 7px 34px; min-height: 40px; }
.route li::before { content: ""; position: absolute; left: 12px; top: 0; bottom: 0; width: 5px; background: #c9d6e4; }
.route li:first-child::before { top: 50%; }
.route li:last-child::before { bottom: 50%; }
.route li.coming::before { background: var(--green); }
.route li.after { opacity: .5; }
.route li::after { content: ""; position: absolute; left: 8px; top: 50%; width: 13px; height: 13px; margin-top: -7px; border-radius: 50%; background: #fff; border: 2.5px solid #9fb2c6; box-sizing: border-box; }
.route li.mine::after { background: var(--butter); border-color: var(--ink); width: 17px; height: 17px; left: 6px; margin-top: -9px; }
.route .nm { font-size: 14px; line-height: 1.3; }
.route li.mine .nm { font-family: var(--f-display); font-size: 16px; }
.route .no { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
.busdot { display: inline-flex; align-items: center; gap: 4px; margin-left: 6px; font-size: 11px; background: var(--green); color: #fff; border: 1.5px solid var(--ink); border-radius: 999px; padding: 0 8px; vertical-align: 2px; }
.busdot.마을 { background: var(--village); }
.routemsg { font-size: 13px; color: var(--muted); padding: 4px 0; }
.bar { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 0 4px; }
.refresh { border: 2px solid var(--ink); background: var(--butter); border-radius: 999px; padding: 6px 16px; font-family: var(--f-display); font-size: 15px; cursor: pointer; box-shadow: 0 2px 0 var(--ink); }
.refresh:active { transform: translateY(2px); box-shadow: none; }
.auto { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
footer { font-size: 12px; color: var(--muted); padding: 0 4px; display: flex; justify-content: space-between; gap: 8px; }
footer a { color: var(--muted); }
.err { color: #c2412d; }
.alarm { display: grid; gap: 10px; }
.alarm h2 { margin: 0; font-family: var(--f-display); font-size: 20px; font-weight: 400; }
.alarm .sub { font-size: 13px; color: var(--muted); margin: 0; }
.alarm .state { font-size: 15px; }
.alarm .state b { font-weight: 400; background: var(--butter); border-radius: 6px; padding: 0 5px; }
.pill { border: 2px solid var(--ink); background: #fff; border-radius: 999px; padding: 6px 14px; font-size: 14px; cursor: pointer; box-shadow: 0 2px 0 var(--ink); font-family: inherit; color: var(--ink); }
.pill.on { background: var(--butter); }
.pill:active { transform: translateY(2px); box-shadow: none; }
.pick { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.pick input { border: 2px solid var(--ink); border-radius: 12px; padding: 5px 10px; font-size: 15px; font-family: inherit; background: #fff; color: var(--ink); }
.offs { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.offs li { display: flex; justify-content: space-between; align-items: center; border: 1.5px dashed #c9d6e4; border-radius: 12px; padding: 6px 10px; font-size: 14px; }
.offs button { border: 1.5px solid var(--ink); background: #fff; border-radius: 999px; padding: 1px 10px; font-size: 12px; cursor: pointer; color: var(--ink); font-family: inherit; }
</style>
</head>
<body>

<section class="card top" aria-live="polite">
  <div class="row"><h1>퇴근버스</h1><span class="updated" id="updated"></span></div>
  <p class="station" id="station">버스 정보를 불러오는 중이에요</p>
  <div class="meta" id="meta"></div>
  <div class="leave" id="leave" hidden></div>
</section>

<div id="list"></div>

<div class="bar">
  <span class="auto" id="auto">20초마다 자동으로 새로고침해요</span>
  <button class="refresh" id="refresh">새로고침</button>
</div>

<section class="card alarm" id="alarm" hidden>
  <h2>퇴근 알림</h2>
  <p class="sub" id="alarmSub">평일 오후 4:20~5:10, 버스가 2정거장 안으로 오면 ntfy로 알려드려요</p>
  <div class="state" id="alarmState"></div>
  <div><button class="pill" id="todayBtn"></button></div>
  <div class="pick"><input type="date" id="offDate" aria-label="알림 끌 날짜"><button class="pill" id="offBtn">이 날 끄기</button></div>
  <ul class="offs" id="offList"></ul>
</section>

<footer>
  <span>자료: 경기도 버스정보 · 공공데이터포털</span>
  <a href="../">구름창 열기</a>
</footer>

<script>
const PROXY = "https://vtxdqesewrsgyhzdvhfo.supabase.co/functions/v1/bus-proxy";
const LEAVE = { h: 16, m: 30 }; // 퇴근 시각
const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2, "0");
const clock = d => `${pad(d.getHours())}:${pad(d.getMinutes())}`;
const ampm = d => { const h = d.getHours(), m = d.getMinutes(); return `${h < 12 ? "오전" : "오후"} ${h % 12 || 12}시${m ? ` ${m}분` : ""}`; };

let fetchedAt = null, timer = null, left = 20, stationId = "";
const openRoutes = new Set();
const routeCache = {};

async function loadRoute(routeId, order, type) {
  try {
    const res = await fetch(`${PROXY}?kind=route&routeId=${routeId}&stationId=${stationId}${order ? `&staOrder=${order}` : ""}`, { cache: "no-store" });
    const r = await res.json();
    if (!res.ok) throw new Error(r.detail || r.error);
    if (!r.stations.length) {
      routeCache[routeId] = '<div class="routemsg">노선 정보를 아직 못 받았어요. 공공데이터포털에서 버스노선·버스위치정보 API 활용신청이 반영되면 보여요.</div>';
    } else {
      // 내 정류장 바로 앞에 있는 버스부터 내 정류장까지 초록 줄
      const before = r.buses.filter(x => x.seq <= r.mySeq).map(x => x.seq);
      const nearest = before.length ? Math.max(...before) : null;
      routeCache[routeId] = `<ol class="route">${r.stations.map(st => {
        const here = r.buses.filter(x => x.seq === st.seq);
        const cls = [st.seq === r.mySeq ? "mine" : "", st.seq > r.mySeq ? "after" : "", nearest !== null && st.seq >= nearest && st.seq < r.mySeq ? "coming" : ""].join(" ");
        const dots = here.map(x => `<span class="busdot ${type}">버스${x.seats !== null ? ` · 빈자리 ${x.seats}` : x.crowded ? ` · ${x.crowded}` : ""}</span>`).join("");
        return `<li class="${cls}"><div class="nm">${st.name}${st.seq === r.mySeq ? " · 내 정류장" : ""}${dots}</div><div class="no">${st.mobileNo}</div></li>`;
      }).join("")}</ol>${r.buses.length ? "" : '<div class="routemsg">지금 이 구간에 다니는 버스가 없어요.</div>'}`;
    }
  } catch (e) {
    routeCache[routeId] = `<div class="routemsg">노선 정보를 못 받았어요. (${String(e.message || e).slice(0, 80)})</div>`;
  }
  const box = $(`rb-${routeId}`); if (box) box.innerHTML = routeCache[routeId];
}

document.addEventListener("click", e => {
  const t = e.target.closest(".toggle"); if (!t) return;
  const id = t.dataset.route;
  if (openRoutes.has(id)) { openRoutes.delete(id); t.setAttribute("aria-expanded", "false"); t.textContent = "버스 어디쯤 있나 보기"; $(`rb-${id}`).hidden = true; }
  else { openRoutes.add(id); t.setAttribute("aria-expanded", "true"); t.textContent = "노선 접기"; $(`rb-${id}`).hidden = false; loadRoute(id, t.dataset.order, t.dataset.type); }
});

function leaveDate() { const d = new Date(); d.setHours(LEAVE.h, LEAVE.m, 0, 0); return d; }
function renderLeave() {
  const now = new Date(), L = leaveDate(), diff = Math.round((L - now) / 60000);
  const el = $("leave");
  if (diff > 0 && diff <= 180) { el.hidden = false; el.textContent = `${ampm(L)} 퇴근까지 ${diff >= 60 ? `${Math.floor(diff / 60)}시간 ${diff % 60}분` : `${diff}분`}`; }
  else if (diff <= 0 && diff > -60) { el.hidden = false; el.textContent = "퇴근 시간이에요! 조심히 가세요"; }
  else el.hidden = true;
}

function busCard(b) {
  const first = b.next[0], second = b.next[1];
  let body;
  if (!first) {
    body = `<div class="empty">${b.status && b.status.includes("종료") ? "오늘 운행 끝났어요" : b.status && b.status.includes("대기") ? "차고지에서 대기 중이에요" : "지금 오는 버스가 없어요"}</div>`;
  } else {
    const arrive = new Date(fetchedAt.getTime() + (first.sec ?? first.min * 60) * 1000);
    const L = leaveDate();
    const hit = arrive >= L && arrive - L <= 25 * 60000 && Date.now() < L.getTime() + 10 * 60000;
    const tags = [];
    if (hit) tags.push(`<span class="tag hit">퇴근하고 타기 좋아요</span>`);
    if (first.seats !== null) tags.push(`<span class="tag">빈자리 ${first.seats}</span>`);
    if (first.crowded) tags.push(`<span class="tag">${first.crowded}</span>`);
    if (first.low) tags.push(`<span class="tag">저상</span>`);
    body = `
      <div class="now">
        <span class="mins${first.min <= 3 ? " soon" : ""}">${first.min <= 1 ? "곧 도착" : `${first.min}<small>분</small>`}</span>
        <span class="detail"><strong>${clock(arrive)}</strong> 도착 예정${first.stops !== null ? ` · ${first.stops}정거장 전` : ""}${first.at ? `<br>지금 ${first.at} 근처` : ""}</span>
      </div>
      ${tags.length ? `<div class="tags">${tags.join("")}</div>` : ""}
      <div class="nextbus">${second ? `다음 차 ${second.min}분 뒤 · ${clock(new Date(fetchedAt.getTime() + (second.sec ?? second.min * 60) * 1000))}${second.stops !== null ? ` · ${second.stops}정거장 전` : ""}` : "다음 차 정보는 아직 없어요"}</div>`;
  }
  const open = openRoutes.has(b.routeId);
  return `<section class="card bus">
    <div class="head"><span class="badge ${b.type}">${b.name}</span>
      <span class="dest">${b.type}버스<br><b>${b.dest ? `${b.dest} 방면` : ""}</b></span></div>
    ${body}
    <button class="toggle" data-route="${b.routeId}" data-order="${b.staOrder ?? ""}" data-type="${b.type}" aria-expanded="${open}">${open ? "노선 접기" : "버스 어디쯤 있나 보기"}</button>
    <div class="routebox" id="rb-${b.routeId}" ${open ? "" : "hidden"}>${routeCache[b.routeId] || '<div class="routemsg">불러오는 중…</div>'}</div>
  </section>`;
}

async function load() {
  clearInterval(timer);
  try {
    const res = await fetch(`${PROXY}?kind=mine`, { cache: "no-store" });
    const j = await res.json();
    if (!res.ok) throw new Error(j.error || "오류");
    fetchedAt = new Date(j.at);
    const g = j.groups[0];
    stationId = g.stationId;
    $("station").textContent = g.station;
    $("meta").textContent = `정류장 번호 ${g.mobileNo} · 엔씨·안랩 방면`;
    $("list").innerHTML = `<div style="display:grid;gap:14px">${g.buses.map(busCard).join("")}</div>`;
    $("updated").textContent = `${clock(fetchedAt)} 기준`;
    g.buses.forEach(b => { if (openRoutes.has(b.routeId)) loadRoute(b.routeId, b.staOrder, b.type); });
  } catch (e) {
    $("station").innerHTML = `<span class="err">버스 정보를 못 받았어요</span>`;
    $("meta").textContent = "잠시 뒤 새로고침을 눌러주세요.";
  }
  renderLeave();
  left = 20;
  timer = setInterval(() => {
    left -= 1;
    $("auto").textContent = `${left}초 뒤 새로고침`;
    if (left <= 0) load();
  }, 1000);
}

$("refresh").addEventListener("click", load);
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") load(); else clearInterval(timer); });
load();
// ── 퇴근 알림 끄기·켜기 (설정 링크로 한 번 등록한 휴대폰에서만)
(() => {
  const q = new URLSearchParams(location.search);
  if (q.get("mt")) { try { localStorage.setItem("bus_mt", q.get("mt")); } catch {} history.replaceState(null, "", location.pathname); }
})();
let MT = ""; try { MT = localStorage.getItem("bus_mt") || ""; } catch {}
const WD = ["일", "월", "화", "수", "목", "금", "토"];
const fmtDay = s => { const [y, m, d] = s.split("-").map(Number); const dt = new Date(y, m - 1, d); return `${m}월 ${d}일 (${WD[dt.getDay()]})`; };
let alarm = null;
function renderAlarm() {
  if (!alarm) return;
  $("alarm").hidden = false;
  const offToday = alarm.mutedDays.includes(alarm.today);
  const [sh, sm] = alarm.start.split(":"), [eh, em] = alarm.end.split(":");
  $("alarmSub").textContent = `${alarm.weekdaysOnly ? "평일 " : ""}오후 ${sh - 12}:${sm}~${eh - 12}:${em}, 버스가 ${alarm.stops}정거장 안으로 오면 ntfy로 알려드려요`;
  $("alarmState").innerHTML = offToday ? "오늘은 알림 <b>꺼짐</b>" : "오늘 알림 <b>켜짐</b>";
  const tb = $("todayBtn"); tb.textContent = offToday ? "오늘 알림 다시 켜기" : "오늘 알림 끄기"; tb.classList.toggle("on", offToday);
  $("offDate").min = alarm.today;
  const future = alarm.mutedDays.filter(d => d !== alarm.today);
  $("offList").innerHTML = future.length ? future.map(d => `<li><span>${fmtDay(d)} 꺼 둠</span><button data-day="${d}">다시 켜기</button></li>`).join("") : "";
}
async function alarmCall(params) {
  const res = await fetch(`${PROXY}?${new URLSearchParams({ mt: MT, ...params })}`, { method: params.kind === "mute" ? "POST" : "GET", cache: "no-store" });
  return res.json();
}
async function loadAlarm() {
  if (!MT) return;
  try { const j = await alarmCall({ kind: "mutestatus" }); if (j.ok) { alarm = j; renderAlarm(); } } catch {}
}
async function setDay(day, on) {
  try {
    const j = await alarmCall({ kind: "mute", day, quiet: "1", ...(on ? { on: "1" } : {}) });
    if (j.ok) { alarm.mutedDays = j.mutedDays; renderAlarm(); }
  } catch {}
}
$("todayBtn").addEventListener("click", () => setDay(alarm.today, alarm.mutedDays.includes(alarm.today)));
$("offBtn").addEventListener("click", () => { const v = $("offDate").value; if (v && v >= alarm.today) { setDay(v, false); $("offDate").value = ""; } });
$("offList").addEventListener("click", e => { const b = e.target.closest("button[data-day]"); if (b) setDay(b.dataset.day, true); });
loadAlarm();
</script>
</body>
</html>
